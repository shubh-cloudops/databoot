{% macro tile(key, label, span=12, extra="", heading=true, tools="") %}<section class="ws-tile{{ " " ~ extra if extra }}" id="tile-{{ key }}" data-tile="{{ key }}" data-span="{{ span }}" aria-label="{{ label }}">
  <div class="ws-head">{% if heading %}<h2>{{ label }}</h2>{% endif %}{{ tools }}<button type="button" class="ws-move" aria-label="Move {{ label }}"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><g fill="currentColor"><circle cx="5.5" cy="3.5" r="1.25"/><circle cx="10.5" cy="3.5" r="1.25"/><circle cx="5.5" cy="8" r="1.25"/><circle cx="10.5" cy="8" r="1.25"/><circle cx="5.5" cy="12.5" r="1.25"/><circle cx="10.5" cy="12.5" r="1.25"/></g></svg></button><button type="button" class="ws-expand" aria-label="Expand {{ label }}" aria-haspopup="dialog"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
  {{ caller() }}
</section>{% endmacro %}
