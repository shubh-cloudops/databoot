{% macro figure(c, hidden=false) %}<figure class="chart"{% if hidden %} hidden{% endif %} id="{{ c.id }}" data-kind="{{ c.kind }}"{% if c.get("orientation") == "h" %} data-leaderboard{% if c.drill is false %} data-drill="false"{% endif %}{% endif %} aria-label="{{ c.title }}">
    <figcaption><span class="chart-title">{{ c.title }}</span> <span class="chart-rule">{{ c.rule }}{% if c.get("score") is not none %} · score {{ "%.2f"|format(c.score) }}{% endif %}</span> <span class="chart-count">{{ c.shown|num }} of {{ c.total|plural("point" if c.kind in ("map3d", "line", "scatter", "monitor") else "row") }}</span> <button type="button" class="btn table-toggle" aria-pressed="false">View as table</button></figcaption>
    <div class="plot" role="img" aria-label="{{ c.title }}: {{ c.rule }}"></div>
  </figure>{% endmacro %}
