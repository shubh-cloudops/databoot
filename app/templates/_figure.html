{% macro figure(c) %}<figure class="chart" id="{{ c.id }}" data-kind="{{ c.kind }}" aria-label="{{ c.title }}">
    <figcaption><span class="chart-title">{{ c.title }}</span> <span class="chart-rule">{{ c.rule }}{% if c.get("score") is not none %} · score {{ "%.2f"|format(c.score) }}{% endif %}</span> <span class="chart-count">{{ c.shown|num }} of {{ c.total|num }} {{ "points" if c.kind in ("map3d", "line", "scatter") else "rows" }}</span> <button type="button" class="btn table-toggle" aria-pressed="false">View as table</button></figcaption>
    <div class="plot" role="img" aria-label="{{ c.title }}: {{ c.rule }}"></div>
  </figure>{% endmacro %}
